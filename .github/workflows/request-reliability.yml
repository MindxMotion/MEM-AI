name: Request reliability database compatibility

on:
  workflow_dispatch:
  push:
    branches: [mindxmotion, feat/root-reliability-panel-20261029, fix/bedrock-compat-and-oidc-20261029, sync/upstream-20261101]
    paths:
      - .github/workflows/request-reliability.yml
      - controller/relay_reliability*
      - model/relay_reliability.go
      - model/relay_outcome.go
      - model/oidc_consolidation.go
      - model/token_migration_test.go
      - middleware/access_token_routes.go
      - middleware/auth_test.go
      - relay/channel/claude/**
      - relaykit/**
      - tokenkit/**
      - controller/oidc_consolidation_test.go
      - router/api-router.go
      - web/src/features/system-settings/operations/**
  pull_request:
    paths:
      - .github/workflows/request-reliability.yml
      - controller/relay_reliability*
      - model/relay_reliability.go
      - model/relay_outcome.go
      - model/oidc_consolidation.go
      - model/token_migration_test.go
      - middleware/access_token_routes.go
      - middleware/auth_test.go
      - relay/channel/claude/**
      - relaykit/**
      - tokenkit/**
      - controller/oidc_consolidation_test.go
      - router/api-router.go

permissions:
  contents: read

jobs:
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-fixture
          MYSQL_DATABASE: fixture
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-fixture
          POSTGRES_DB: fixture
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fixture"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      GOWORK: 'off'
      TEST_MANAGE_USER_SEPARATE_LOG_DB: '1'
      TEST_MYSQL_DSN: root:${{ github.run_id }}-${{ github.run_attempt }}-fixture@tcp(127.0.0.1:3306)/fixture?charset=utf8mb4&parseTime=True&loc=UTC
      TEST_POSTGRES_DSN: postgres://postgres:${{ github.run_id }}-${{ github.run_attempt }}-fixture@127.0.0.1:5432/fixture?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Create frontend embed placeholder
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Verify real SQLite, MySQL and PostgreSQL instances
        shell: bash
        run: |
          set -euo pipefail
          for dialect in sqlite mysql postgres; do
            TEST_MANAGE_USER_DIALECT="$dialect" TEST_TASK_DB_DIALECT="$dialect" \
              AUDIT_MYSQL_DSN="$TEST_MYSQL_DSN" AUDIT_POSTGRES_DSN="$TEST_POSTGRES_DSN" \
              go test -mod=readonly -p=1 ./controller \
              -run 'DatabaseMatrix|RootAccessAndValidation|TaskPlugin' -count=1 -v
            channel_dsn=''
            if [[ "$dialect" == mysql ]]; then channel_dsn="$TEST_MYSQL_DSN"; fi
            if [[ "$dialect" == postgres ]]; then channel_dsn="$TEST_POSTGRES_DSN"; fi
            TEST_CHANNEL_SQL_DSN="$channel_dsn" \
              go test -mod=readonly -p=1 ./controller -run '^TestAddChannel' -count=1 -v
          done
          go test -mod=readonly -p=1 ./model \
            -run 'DatabaseMatrix|Migration|MigrateToken' -count=1 -v
      - name: Vet and test complete gateway
        run: |
          go vet -mod=readonly ./...
          env -u TEST_MYSQL_DSN -u TEST_POSTGRES_DSN \
            go test -mod=readonly -p=2 ./... -count=1
      - name: Build gateway
        run: go build -mod=readonly ./...
      - name: Verify native and opt-in Claude compatibility
        run: go test -mod=readonly -p=2 ./relay/channel/claude ./relay/common -count=1
      - name: Build independent relaykit module
        working-directory: relaykit
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -p=2 ./... -count=1
          go build -mod=readonly ./...
      - name: Verify independent tokenkit module
        working-directory: tokenkit
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -p=2 ./... -count=1
          go build -mod=readonly ./...
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun check -b
      - name: Lint synchronized frontend files
        shell: bash
        run: |
          git fetch --depth=1 origin e1a3604d5d1068f0fb8936db668abb4f6876fa2c
          mapfile -t files < <(git diff --relative --name-only --diff-filter=ACMR \
            e1a3604d5d1068f0fb8936db668abb4f6876fa2c HEAD -- '*.ts' '*.tsx' '*.mjs')
          if ((${#files[@]})); then
            bun x oxlint -c .oxlintrc.json "${files[@]}"
          fi
      - run: bun run test --maxWorkers=2
      - run: bun run build

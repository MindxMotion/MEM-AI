apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: new-api
  namespace: new-api
  labels:
    app.kubernetes.io/part-of: new-api
spec:
  http:
    - name: canonical-entry
      priority: 20
      match:
        hosts: [gateway.example.com]
        paths: [/mem-ai]
        methods: [GET, HEAD]
      backends:
        - serviceName: new-api
          servicePort: 3000
      plugins:
        - name: redirect
          enable: true
          config:
            uri: https://gateway.example.com/mem-ai/
            ret_code: 308
            append_query_string: true
    - name: legacy-entry
      priority: 20
      match:
        hosts: [gateway.example.com]
        paths: [/new-api]
        methods: [GET, HEAD]
      backends:
        - serviceName: new-api
          servicePort: 3000
      plugins:
        - name: redirect
          enable: true
          config:
            uri: https://gateway.example.com/mem-ai/
            ret_code: 302
            append_query_string: true
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                Cache-Control: no-store
                Referrer-Policy: no-referrer
    - name: legacy-console
      priority: 10
      match:
        hosts: [gateway.example.com]
        paths: [/new-api/*]
        methods: [GET, HEAD]
        exprs:
          - subject:
              scope: Path
            op: RegexNotMatch
            value: '^/new-api/(?:(?:api|v1|v1beta|mj|pg|static|assets)(?:/|$)|[^/]+/mj(?:/|$)|dashboard/billing(?:/|$)|source(?:/|\.tar\.gz$|$))'
      backends:
        - serviceName: new-api
          servicePort: 3000
      plugins:
        - name: redirect
          enable: true
          config:
            regex_uri: ['^/new-api/(.*)$', 'https://gateway.example.com/mem-ai/$1']
            ret_code: 302
            append_query_string: true
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                Cache-Control: no-store
                Referrer-Policy: no-referrer
    - name: application
      websocket: true
      match:
        hosts: [gateway.example.com]
        paths: [/mem-ai/*, /new-api/*]
      backends:
        - serviceName: new-api
          servicePort: 3000
          resolveGranularity: service
      plugins:
        - name: redirect
          enable: true
          config:
            http_to_https: true
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ['^/(?:mem-ai|new-api)/(.*)$', '/$1']
        - name: response-rewrite
          enable: true
          config:
            vars:
              - [upstream_http_location, '~~', '^/(?!/|(?:mem-ai|new-api)(?:[/?#]|$))']
            headers:
              set:
                Location: '/mem-ai$upstream_http_location'
      timeout:
        connect: 10s
        send: 30s
        read: 360s
